name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Application web
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: APK signé
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../SewingCompanion-${VERSION_NAME}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SewingCompanion-${{ env.VERSION_NAME }}
          path: SewingCompanion-*.apk

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v$VERSION_NAME" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$VERSION_NAME" SewingCompanion-$VERSION_NAME.apk \
            --title "Sewing Companion $VERSION_NAME" --latest \
            --notes "Télécharge SewingCompanion-$VERSION_NAME.apk depuis ton téléphone Android et ouvre-le pour l'installer. Les mises à jour s'installent par-dessus la version précédente sans perdre tes projets."
